name: Build Standard 2800 V5 Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/release-keystore.jks"

          test -s "$RUNNER_TEMP/release-keystore.jks"

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/release-keystore.jks
          EOF

      - name: Configure Android Gradle signing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if groovy.exists():
              p = groovy
              is_kotlin = False
          elif kotlin.exists():
              p = kotlin
              is_kotlin = True
          else:
              raise SystemExit("Android Gradle file not found")

          s = p.read_text()

          if is_kotlin:
              imports = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
              )
              if "import java.util.Properties" not in s:
                  s = imports + s

              properties = '''
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          '''

              if "val keystoreProperties = Properties()" not in s:
                  s = s.replace("android {", properties + "android {", 1)

              signing = '''
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

          '''

              if 'create("release")' not in s:
                  s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)

              if 'signingConfig = signingConfigs.getByName("release")' not in s:
                  pattern = r'(buildTypes\s*\{\s*release\s*\{)'
                  s, count = re.subn(
                      pattern,
                      r'\1\n            signingConfig = signingConfigs.getByName("release")',
                      s,
                      count=1
                  )
                  if count == 0:
                      raise SystemExit("Could not find release build type")

              s = s.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")'
              )

          else:
              imports = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
              )
              if "import java.util.Properties" not in s:
                  s = imports + s

              properties = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          '''

              if "def keystoreProperties = new Properties()" not in s:
                  s = s.replace("android {", properties + "android {", 1)

              signing = '''
              signingConfigs {
                  release {
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                      storeFile file(keystoreProperties["storeFile"])
                      storePassword keystoreProperties["storePassword"]
                  }
              }

          '''

              if "signingConfigs {" not in s:
                  s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)

              if "signingConfig signingConfigs.release" not in s:
                  pattern = r'(buildTypes\s*\{\s*release\s*\{)'
                  s, count = re.subn(
                      pattern,
                      r'\1\n            signingConfig signingConfigs.release',
                      s,
                      count=1
                  )
                  if count == 0:
                      raise SystemExit("Could not find release build type")

              s = s.replace(
                  "signingConfig signingConfigs.debug",
                  "signingConfig signingConfigs.release"
              )

          p.write_text(s)
          print(f"Configured release signing in {p}")
          PY

      - name: Run tests
        run: flutter test

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)"

          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: standard-2800-v5-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
